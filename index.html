<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Runner con Imágenes PNG</title>
    <style>
        body {
            background-color: #12121c;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            display: flex;
            gap: 20px;
            background: #1e1e2d;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #333;
        }
        canvas {
            background: #0a0a10;
            border-radius: 6px;
            border: 1px solid #444;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        label { font-size: 14px; }
    </style>
</head>
<body>

    <h1>Dino Runner (Sprites PNG de GitHub)</h1>

    <div class="container">
        <!-- Creador -->
        <div class="controls">
            <h3>Creador</h3>
            <label>Pelo: 
                <select id="hairSelect">
                    <option value="0">Corto</option>
                    <option value="1">Cresta</option>
                    <option value="2">Largo</option>
                </select>
            </label>
            <label>Camiseta: 
                <select id="shirtSelect">
                    <option value="0">Roja</option>
                    <option value="1">Azul</option>
                </select>
            </label>
            <canvas id="prevCanvas" width="100" height="120"></canvas>
        </div>

        <!-- Juego -->
        <div>
            <canvas id="gameCanvas" width="600" height="200"></canvas>
        </div>
    </div>

    <script>
        // Carga de imágenes desde archivos PNG locales / GitHub
        const charImg = new Image();
        charImg.src = 'character_sprites.png';

        const gameImg = new Image();
        gameImg.src = 'game_sprites.png';

        let imagesLoaded = 0;
        function onImageLoad() {
            imagesLoaded++;
            if (imagesLoaded === 2) {
                initGame();
            }
        }

        charImg.onload = onImageLoad;
        gameImg.onload = onImageLoad;

        // Selección de ropa
        let selectedHair = 0;
        let selectedShirt = 0;

        document.getElementById('hairSelect').addEventListener('change', (e) => {
            selectedHair = parseInt(e.target.value);
            drawPreview();
        });

        document.getElementById('shirtSelect').addEventListener('change', (e) => {
            selectedShirt = parseInt(e.target.value);
            drawPreview();
        });

        // Dibujar previsualización con imágenes PNG
        const prevCtx = document.getElementById('prevCanvas').getContext('2d');
        function drawPreview() {
            prevCtx.clearRect(0, 0, 100, 120);
            
            // Recorta el cuerpo base del PNG (ejemplo x:0, y:0, w:32, h:48)
            prevCtx.drawImage(charImg, 0, 0, 32, 48, 34, 30, 32, 48);
            
            // Recorta la camiseta seleccionada del PNG
            prevCtx.drawImage(charImg, selectedShirt * 32, 48, 32, 20, 34, 48, 32, 20);
            
            // Recorta el pelo seleccionado del PNG
            prevCtx.drawImage(charImg, selectedHair * 32, 68, 32, 20, 34, 25, 32, 20);
        }

        // Bucle básico del juego
        const gameCanvas = document.getElementById('gameCanvas');
        const gCtx = gameCanvas.getContext('2d');
        let playerY = 130;

        function initGame() {
            drawPreview();
            gameLoop();
        }

        function gameLoop() {
            gCtx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);

            // Dibujar suelo desde game_sprites.png
            gCtx.drawImage(gameImg, 0, 100, 600, 20, 0, 178, 600, 20);

            // Dibujar obstáculo/cactus desde game_sprites.png
            gCtx.drawImage(gameImg, 0, 0, 30, 50, 450, 130, 30, 50);

            // Dibujar personaje equipado en tiempo real
            gCtx.drawImage(charImg, 0, 0, 32, 48, 50, playerY, 32, 48); // Cuerpo
            gCtx.drawImage(charImg, selectedShirt * 32, 48, 32, 20, 50, playerY + 18, 32, 20); // Camiseta
            gCtx.drawImage(charImg, selectedHair * 32, 68, 32, 20, 50, playerY - 5, 32, 20); // Pelo

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
